# mihomo 全量配置（订阅地址与 WebUI 密钥由 sops 填入）
# 改完执行：nix-switch；订阅由 mihomo 按 interval 自行拉取热更新
# 未写出的项一律走 mihomo 默认值（rule 模式 / allow-lan 关）

mixed-port: 7890
ipv6: false
tcp-concurrent: true
unified-delay: true
log-level: warning
geodata-mode: true

external-controller: 127.0.0.1:9090
secret: "@webui-secret@"

profile:
  store-fake-ip: true

tun:
  enable: true
  stack: gvisor
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  strict-route: true

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - localhost.ptlogin2.qq.com
    - +.lan
    - +.local
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

proxy-providers:
  airport:
    type: http
    url: "@subscription-url@"
    interval: 86400
    header:
      User-Agent: [clash.meta]
    path: providers/airport.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: PROXY
    type: url-test
    use: [airport]
    filter: "(优化|HY2)"
    url: https://www.gstatic.com/generate_204
    interval: 60
    tolerance: 150

rules:
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
