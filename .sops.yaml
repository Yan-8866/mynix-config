creation_rules:
  # 主机密文：主机 SSH key + 管理员 key，管理员可离线编辑
  - path_regex: ^secrets/hosts/um480xt\.yaml$
    age: [ *um480xt, *admin ]
  - path_regex: ^secrets/hosts/pu500c\.yaml$
    age: [ *pu500c, *admin ]
  - path_regex: ^secrets/hosts/demo\.yaml$
    age: [ *pu500c, *admin ] # demo 当前复用 pu500c 主机密钥，待独立
  # 用户密文：当前统一为管理员 age key，由管理员代管
  - path_regex: ^secrets/users/[^/]+\.yaml$
    age: [ *admin ]
